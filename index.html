<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 60px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1rem;
      color: #a0a0c0;
    }

    nav {
      background: #16213e;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px;
    }

    nav a {
      color: #e0e0f0;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #7f7fff;
    }

    main {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px;
    }

    section {
      margin-bottom: 60px;
    }

    section h2 {
      font-size: 1.6rem;
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 2px solid #1a1a2e;
    }

    .about p {
      font-size: 1rem;
      color: #555;
    }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      list-style: none;
    }

    .skills-list li {
      background: #1a1a2e;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .project-card {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .project-card h3 {
      margin-bottom: 8px;
    }

    .project-card p {
      font-size: 0.9rem;
      color: #666;
    }

    .contact p {
      font-size: 1rem;
      color: #555;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #1a1a2e;
      color: #a0a0c0;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Your Name</h1>
    <p>Your Title / Tagline</p>
  </header>

  <nav>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <section id="about" class="about">
      <h2>About</h2>
      <p>自己紹介を書いてください。</p>
    </section>

    <section id="skills">
      <h2>Skills</h2>
      <ul class="skills-list">
        <li>Skill 1</li>
        <li>Skill 2</li>
        <li>Skill 3</li>
      </ul>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <div class="projects-grid">
        <div class="project-card">
          <h3>Project Name</h3>
          <p>プロジェクトの説明を書いてください。</p>
        </div>
      </div>
    </section>

    <section id="contact" class="contact">
      <h2>Contact</h2>
      <p>連絡先を書いてください。</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Your Name</p>
  </footer>

</body>
</html>
